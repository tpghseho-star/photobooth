<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>포토부스</title>
<style>
  :root{--bg:#111;--fg:#fff;--accent:#ff4f8b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
  .screen.on{display:flex}
  h1{margin:0 0 8px;font-size:28px}
  p{margin:0 0 20px;opacity:.7;font-size:15px}
  button{font:inherit;border:0;border-radius:999px;padding:14px 28px;font-size:17px;font-weight:700;background:var(--accent);color:#fff}
  button.ghost{background:#333}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  /* camera */
  #cam{padding:0;justify-content:flex-start;background:#000}
  .stage{position:relative;width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  video{display:none}
  #live{width:100%;height:100%;object-fit:contain}
  #count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.6);pointer-events:none}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
  .bar{width:100%;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:14px;background:#000}
  #thumbs{display:flex;gap:6px}
  #thumbs i{width:34px;height:26px;border-radius:4px;background:#333 center/cover}
  #shot{width:72px;height:72px;padding:0;border:4px solid #fff;background:var(--accent)}
  /* result */
  #res img{max-height:68vh;max-width:90vw;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.6);margin-bottom:16px}
  #msg{font-size:13px;opacity:.6;margin-top:12px;max-width:300px}
</style>
</head>
<body>

<section id="intro" class="screen on">
  <h1>📸 포토부스</h1>
  <p>프레임이 적용된 모습을 보면서 찍어보세요</p>
  <button id="start">시작하기</button>
  <div id="msg0" style="margin-top:14px;font-size:13px;color:#ff9;"></div>
</section>

<section id="cam" class="screen">
  <div class="stage">
    <video id="v" playsinline muted autoplay></video>
    <canvas id="live"></canvas>
    <div id="count"></div>
    <div id="flash"></div>
  </div>
  <div class="bar">
    <button id="shot" aria-label="촬영"></button>
  </div>
</section>

<section id="res" class="screen">
  <img id="out" alt="결과">
  <div class="row">
    <button id="save">📥 저장하기</button>
    <button id="again" class="ghost">다시 찍기</button>
  </div>
  <div id="msg">저장 버튼 → 공유 시트에서 '이미지 저장'(iOS) / 다운로드(안드로이드)</div>
</section>

<script>
/* ============ 설정 ============ */
const CFG = {
  frameSrcs: ['frame.png','frame.jpg'], // 같은 폴더의 프레임 이미지
  cols: 1, rows: 1,        // 사진 배치 (1x1 = 1컷)
  gap: 0,                  // 사진 사이 간격(px)
  countdown: 3,
  mirror: true,            // 셀카처럼 좌우반전 저장
  bgColor: '#000000'       // 프레임 뒤 배경색
};
/* ================================ */

const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
let stream, frameCanvas, win, slots = [], busy = false, resultBlob;

function loadImg(src){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = src + '?t=' + Date.now();
  });
}

// 프레임 로드 + 흰색 사진창 자동 감지(투명 PNG면 그대로 사용)
async function loadFrame(){
  let im = null;
  for(const s of CFG.frameSrcs){ im = await loadImg(s); if(im) break; }
  if(!im) throw new Error('frame.png / frame.jpg 파일을 찾을 수 없습니다.');
  const W = im.naturalWidth, H = im.naturalHeight;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d', {willReadFrequently:true});
  g.drawImage(im, 0, 0);
  const d = g.getImageData(0,0,W,H), p = d.data;
  const isWin = i => p[i+3] < 10 || (p[i] > 240 && p[i+1] > 240 && p[i+2] > 240);
  // 중앙에서 flood fill → 흰 창 영역만 투명 처리
  const seen = new Uint8Array(W*H), stack = [(H>>1)*W + (W>>1)];
  let x0=W, y0=H, x1=0, y1=0;
  while(stack.length){
    const k = stack.pop();
    if(seen[k]) continue;
    const i = k*4; if(!isWin(i)) continue;
    seen[k] = 1; p[i+3] = 0;
    const x = k % W, y = (k / W) | 0;
    if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    if(x>0)stack.push(k-1); if(x<W-1)stack.push(k+1);
    if(y>0)stack.push(k-W); if(y<H-1)stack.push(k+W);
  }
  // 창 가장자리 안티앨리어싱 여백 제거 (살짝 겹치게)
  g.putImageData(d,0,0);
  win = {x:x0, y:y0, w:x1-x0+1, h:y1-y0+1};
  // 슬롯 계산
  slots = [];
  const sw = (win.w - CFG.gap*(CFG.cols-1)) / CFG.cols;
  const sh = (win.h - CFG.gap*(CFG.rows-1)) / CFG.rows;
  for(let r=0;r<CFG.rows;r++) for(let q=0;q<CFG.cols;q++)
    slots.push({x:Math.round(win.x+q*(sw+CFG.gap)), y:Math.round(win.y+r*(sh+CFG.gap)), w:Math.round(sw), h:Math.round(sh)});
  frameCanvas = c;
}

// 카메라
async function openCam(){
  if(!navigator.mediaDevices?.getUserMedia){
    $('msg0').textContent = 'HTTPS 환경의 최신 브라우저(Safari/Chrome)에서 접속해주세요.'; return false;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user', width:{ideal:1920}, height:{ideal:1080}}, audio:false});
    $('v').srcObject = stream; await $('v').play();
    return true;
  }catch(e){
    $('msg0').textContent = '카메라 권한이 필요합니다: ' + e.message; return false;
  }
}

// 영상을 슬롯 비율로 중앙 크롭해서 g의 (x,y,w,h)에 그림
function drawVideo(g, x, y, w, h){
  const v = $('v'); if(!v.videoWidth) return;
  const vr = v.videoWidth / v.videoHeight, sr = w / h;
  let sw, sh, sx, sy;
  if(vr > sr){ sh = v.videoHeight; sw = sh*sr; sx = (v.videoWidth-sw)/2; sy = 0; }
  else { sw = v.videoWidth; sh = sw/sr; sx = 0; sy = (v.videoHeight-sh)/2; }
  g.save();
  if(CFG.mirror){ g.translate(x+w, y); g.scale(-1,1); g.drawImage(v, sx,sy,sw,sh, 0,0,w,h); }
  else g.drawImage(v, sx,sy,sw,sh, x,y,w,h);
  g.restore();
}
// 배경 + 카메라 + 프레임 합성 (라이브 미리보기와 최종 저장이 동일한 함수)
function render(g){
  g.fillStyle = CFG.bgColor; g.fillRect(0,0,frameCanvas.width,frameCanvas.height);
  const sl = slots[0]; drawVideo(g, sl.x, sl.y, sl.w, sl.h);
  g.drawImage(frameCanvas, 0, 0);  // 프레임이 위에 덮임
}
// 실시간 미리보기: 프레임이 적용된 모습을 보면서 포즈 잡기
let liveOn = false;
function startLive(){
  const c = $('live'), g = c.getContext('2d');
  c.width = Math.round(frameCanvas.width/2); c.height = Math.round(frameCanvas.height/2); // 가볍게
  g.scale(.5,.5);
  liveOn = true;
  (function loop(){ if(!liveOn) return; render(g); requestAnimationFrame(loop); })();
}

const sleep = ms => new Promise(r => setTimeout(r,ms));

async function shoot(){
  if(busy) return; busy = true;
  for(let t=CFG.countdown; t>0; t--){ $('count').textContent = t; await sleep(1000); }
  $('count').textContent = '';
  // 풀 해상도로 최종 합성
  const c = document.createElement('canvas'); c.width = frameCanvas.width; c.height = frameCanvas.height;
  render(c.getContext('2d'));
  const f = $('flash'); f.style.transition='none'; f.style.opacity=.9; void f.offsetWidth;
  f.style.transition='opacity .35s'; f.style.opacity=0;
  resultBlob = await new Promise(r => c.toBlob(r, 'image/png'));
  $('out').src = URL.createObjectURL(resultBlob);
  await sleep(400);
  liveOn = false; show('res'); busy = false;
}

async function save(){
  const file = new File([resultBlob], `photobooth_${Date.now()}.png`, {type:'image/png'});
  // 모바일: 공유 시트 → '이미지 저장' (iOS 사진앱에 바로 저장)
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  // 폴백: 다운로드
  const a = document.createElement('a');
  a.href = URL.createObjectURL(resultBlob); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}

$('start').onclick = async () => {
  try{ await loadFrame(); }catch(e){ $('msg0').textContent = e.message; return; }
  if(!(await openCam())) return;
  show('cam'); startLive();
};
$('shot').onclick = shoot;
$('save').onclick = save;
$('again').onclick = () => { show('cam'); startLive(); };
</script>
</body>
</html>
